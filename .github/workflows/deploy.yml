name: 🚀 Deploy to Production

on:
  push:
    branches:
      - deploy
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to server
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v6

      - name: 🔐 Setup SSH
        uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: ${{ secrets.SERVER_SSH_KEY }}

      - name: 🚀 Deploy to production server
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_SSH_PORT: ${{ secrets.SERVER_SSH_PORT }}
          PROJECT_DIR: ${{ secrets.PROJECT_DIR }}
          GITHUB_REPO: ${{ github.repository }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ssh -p ${SERVER_SSH_PORT:-22} -o StrictHostKeyChecking=no ${SERVER_USER}@${SERVER_HOST} \
            "export PROJECT_DIR='${PROJECT_DIR}' GITHUB_REPO='${GITHUB_REPO}' GITHUB_TOKEN='${GITHUB_TOKEN}' && bash -s" << 'ENDSSH'
            set -e

            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && . "$NVM_DIR/nvm.sh"
            [ -s "$HOME/.bashrc" ] && . "$HOME/.bashrc"

            cd "${PROJECT_DIR:-/var/www/docs}"

            echo "🔧 Настройка Git remote (HTTPS с токеном)..."
            REMOTE_URL=$(git remote get-url origin 2>/dev/null || echo "")
            HTTPS_URL="https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPO}.git"

            if [[ "$REMOTE_URL" != "$HTTPS_URL" ]]; then
              git remote set-url origin "$HTTPS_URL" 2>/dev/null || git remote add origin "$HTTPS_URL"
              echo "✅ Remote URL настроен"
            fi

            echo "🔄 Получение изменений из репозитория..."
            git fetch origin
            git checkout deploy || git checkout -b deploy
            git pull origin deploy

            echo "📌 Node.js версия: $(node -v)"

            echo "📦 Установка зависимостей..."
            npm install --production=false

            echo "🔨 Сборка фронтенда..."
            npm run build

            echo "🚀 Перезапуск сервера через PM2..."
            if pm2 describe docs > /dev/null 2>&1; then
              pm2 restart docs
            else
              pm2 start server/index.js --name docs
            fi
            pm2 save

            echo "✅ Деплой завершен успешно!"
            echo "📋 Статус сервера:"
            pm2 status docs
          ENDSSH

      - name: ✅ Deployment status
        run: |
          echo "Деплой завершен! Проверьте результат на сервере."
