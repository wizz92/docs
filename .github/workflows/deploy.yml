name: 🚀 Deploy to Production

on:
  push:
    branches:
      - deploy
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to server
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v6

      - name: 🔐 Setup SSH
        uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: ${{ secrets.SERVER_SSH_KEY }}

      - name: 🚀 Deploy to production server
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_SSH_PORT: ${{ secrets.SERVER_SSH_PORT }}
          PROJECT_DIR: ${{ secrets.PROJECT_DIR }}
          GITHUB_REPO: ${{ github.repository }}
        run: |
          ssh -p ${SERVER_SSH_PORT:-22} -o StrictHostKeyChecking=no ${SERVER_USER}@${SERVER_HOST} << 'ENDSSH'
            set -e
            cd ${PROJECT_DIR:-~/project/docs}

            echo "🔧 Настройка SSH для Git..."
            mkdir -p ~/.ssh
            chmod 700 ~/.ssh

            if ! grep -q "github.com" ~/.ssh/known_hosts 2>/dev/null; then
              echo "Добавление GitHub в known_hosts..."
              ssh-keyscan -t rsa,ecdsa,ed25519 github.com >> ~/.ssh/known_hosts 2>/dev/null || true
              chmod 600 ~/.ssh/known_hosts
            fi

            if [ ! -f ~/.ssh/config ] || ! grep -q "Host github.com" ~/.ssh/config; then
              echo "Настройка SSH config для GitHub..."
              printf "Host github.com\n  StrictHostKeyChecking no\n  UserKnownHostsFile /dev/null\n" >> ~/.ssh/config
              chmod 600 ~/.ssh/config
            fi

            echo "🔧 Проверка и настройка Git remote..."
            REMOTE_URL=$(git remote get-url origin 2>/dev/null || echo "")

            if [[ "$REMOTE_URL" == https://github.com/* ]]; then
              echo "Переключение remote с HTTPS на SSH..."
              REPO_NAME=$(echo "$REMOTE_URL" | sed 's|https://github.com/||' | sed 's|\.git$||')
              git remote set-url origin "git@github.com:${REPO_NAME}.git"
              echo "✅ Remote URL изменен на SSH"
            elif [[ "$REMOTE_URL" == "" ]]; then
              echo "⚠️ Remote не настроен, настраиваем..."
              git remote add origin "git@github.com:${GITHUB_REPO}.git" || true
            fi

            echo "🔄 Получение изменений из репозитория..."
            export GIT_SSH_COMMAND="ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null"
            git fetch origin
            git checkout deploy || git checkout -b deploy
            git pull origin deploy

            echo "🔨 Сборка проекта..."
            npm run build

            echo "✅ Деплой завершен успешно!"
          ENDSSH

      - name: ✅ Deployment status
        run: |
          echo "Деплой завершен! Проверьте результат на сервере."
